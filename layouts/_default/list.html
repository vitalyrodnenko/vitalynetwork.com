{{ define "main" }}
<div class="container container-narrow">
    <div class="blog-header">
        <h1 style="text-transform: capitalize;">{{ .Title }}</h1>
        {{ if .Content }}
        <div style="font-size: 18px; color: var(--text-secondary); max-width: 500px;">
            {{ .Content }}
        </div>
        {{ end }}
    </div>

    <div class="article-list">
        {{ range .Pages.ByDate.Reverse }}
        <a href="{{ .Permalink }}" class="article-row">
            {{ if not .Date.IsZero }}
            <div class="article-date">{{ .Date.Format "Jan 2, 2006" }}</div>
            {{ else }}
            <div class="article-date">Tagged</div>
            {{ end }}
            <div>
                <div class="article-title">{{ .Title }}</div>
                {{ with .Params.description }}
                <div class="article-excerpt">{{ . }}</div>
                {{ end }}
            </div>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
