{{ define "main" }}
<div class="container container-narrow">
    <div class="blog-header">
        <h1>Blog</h1>
        <p>Writing about what it takes to move AI from impressive demos to accountable, production-grade systems.</p>
    </div>

    <div class="article-list">
        {{ range .Pages.ByDate.Reverse }}
        {{ partial "article-entry.html" . }}
        {{ end }}
    </div>
</div>
{{ end }}
